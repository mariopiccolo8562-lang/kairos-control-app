name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # La firma arriva dai Secrets di GitHub (non e' nel codice pubblico)
      - name: Prepara firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/kairos-control.jks

      - name: Compila APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk kairos-control.apk

      # Pubblica l'APK come Release: link fisso sempre aggiornato
      - name: Pubblica Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kairos Control 1.0.${{ github.run_number }}
          files: kairos-control.apk
          make_latest: true
